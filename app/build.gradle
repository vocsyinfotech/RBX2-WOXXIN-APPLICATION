plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'rbxquest.rbux.rbxcal'
    compileSdk 36

    defaultConfig {
        applicationId "rbxquest.rbux.rbxcal"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // Bhisma SDK (ad mediation + Qureka + Install Referrer)
    implementation project(':bhisma')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.browser:browser:1.2.0'

    // Material Design
    implementation 'com.google.android.material:material:1.13.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.6'

    // Firebase BoM (upgraded for bhisma compatibility)
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Ads (upgraded to match bhisma)
    implementation 'com.google.android.gms:play-services-ads:24.7.0'

    // Facebook SDK (for FB Audience Network mediation)
    implementation 'com.facebook.android:facebook-android-sdk:18.1.3'

    // Image + animation libs used by bhisma ad templates
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.0.6'

    // Scalable dp/sp
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.intuit.ssp:ssp-android:1.1.0'

    testImplementation 'junit:junit:4.13.2'
}
